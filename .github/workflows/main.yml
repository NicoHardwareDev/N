name: FPGA Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar e Instalar OSS CAD Suite
        run: |
          # 1. Descargamos la suite oficial de YosysHQ
          export SUITE_URL=$(curl -s https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest | grep "browser_download_url.*linux-x64" | head -n 1 | cut -d '"' -f 4)
          echo "Descargando desde: $SUITE_URL"
          curl -L -o oss-cad-suite.tgz "$SUITE_URL"
          
          # 2. Descomprimimos directamente en el directorio raíz del espacio de trabajo
          mkdir -p $GITHUB_WORKSPACE/oss-cad-suite
          tar -xzf oss-cad-suite.tgz -C $GITHUB_WORKSPACE/oss-cad-suite --strip-components=1

      - name: Sintetizar y Rutear
        run: |
          # 3. Activamos el entorno usando el script de inicialización oficial de la suite
          source $GITHUB_WORKSPACE/oss-cad-suite/environment
          
          # 4. Ahora sí, corremos los comandos nativos sin rutas manuales rotas
          yosys -p "read_verilog procesador_final.v; synth_xilinx -flatten -abc9 -arch xc7; write_json hardware.json"
          
          nextpnr-xilinx --chipdb $GITHUB_WORKSPACE/oss-cad-suite/share/nextpnr/xilinx-chipdb/xc7a35t.bin --json hardware.json --xdc constraints.xdc --write hardware_out.json --device xc7a35tcsg324-1
          
          prjxray-bitstream --fasm hardware_out.json --bit hardware.bit
          
      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: hardware.bit
