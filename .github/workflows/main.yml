name: FPGA Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Esto configura de forma nativa Yosys, Nextpnr y las bases de datos de Xilinx 7
      - name: Configurar Herramientas FPGA
        uses: ammar-ba/setup-hdl@v1
        with:
          toolchain: oss-cad-suite

      - name: Sintetizar y Rutear
        run: |
          # 1. Convierte tu Verilog a JSON
          yosys -p "read_verilog procesador_final.v; synth_xilinx -flatten -abc9 -arch xc7; write_json hardware.json"
          
          # 2. Hace el ruteo usando el chipdb autoconfigurado por la acción
          nextpnr-xilinx --chipdb $GITHUB_WORKSPACE/chipdb/xc7a35t.bin --json hardware.json --xdc constraints.xdc --write hardware_out.json --device xc7a35tcsg324-1
          
          # 3. Genera el bitstream final
          prjxray-bitstream --fasm hardware_out.json --bit hardware.bit
          
      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: hardware.bit
