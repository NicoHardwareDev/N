name: FPGA Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Esta acción descarga e instala la suite de forma nativa y correcta en el sistema
      - name: Setup OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: 'latest'

      # Ejecutamos las herramientas de forma directa usando los comandos del sistema
      - name: Sintetizar y Rutear
        run: |
          # 1. Sintetizar Verilog a JSON
          yosys -p "read_verilog procesador_final.v; synth_xilinx -flatten -abc9 -arch xc7; write_json hardware.json"
          
          # 2. Ruteo (Buscamos el chipdb dinámicamente usando la ruta de la acción)
          nextpnr-xilinx --chipdb $OSSCADSUITE_PATH/../share/nextpnr/xilinx-chipdb/xc7a35t.bin --json hardware.json --xdc constraints.xdc --write hardware_out.json --device xc7a35tcsg324-1
          
          # 3. Generar bitstream
          prjxray-bitstream --fasm hardware_out.json --bit hardware.bit
          
      - name: Subir el resultado
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: hardware.bit
